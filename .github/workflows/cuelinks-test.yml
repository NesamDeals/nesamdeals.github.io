name: Cuelinks test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch offers
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, collections
          key = os.environ.get("CUELINKS_API_KEY", "")
          print("key present:", bool(key))
          url = "https://developers.cuelinks.com/pub_api/v3/offers?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": "Token " + key, "Accept": "application/json"})
          try:
              body = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print("HTTP error", e.code)
              print(e.read().decode()[:300])
              raise SystemExit(1)
          data = body.get("data", [])
          meta = body.get("meta", {})
          print("total offers:", meta.get("total"), "| this page:", len(data))
          print("with tracking link:", sum(1 for o in data if o.get("tracking_url")))
          print("stores:", collections.Counter(o.get("campaign_name") for o in data).most_common(15))
          print("types:", collections.Counter(o.get("offer_type") for o in data))
          for o in data[:12]:
              print("-", o.get("campaign_name"), "|", o.get("title"), "|", o.get("original_price"), o.get("discount_price"), o.get("percent_off"), "|", o.get("end_date"))
          PY
