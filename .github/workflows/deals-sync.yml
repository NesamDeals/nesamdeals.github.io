name: Deals sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: deals-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install
        run: pip install firebase-admin
      - name: Sync deals
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, datetime, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          import firebase_admin
          from firebase_admin import credentials, firestore
          NOW = time.time()
          UA = "TruePick-DealsSync/1.0 (+https://nesamdeals.github.io)"
          UA2 = "Mozilla/5.0 (compatible; TruePickLinkPreview/1.0; +https://nesamdeals.github.io)"
          H = {"Authorization": "Token " + os.environ["CUELINKS_API_KEY"], "Accept": "application/json", "User-Agent": UA}
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          def api(path):
              req = urllib.request.Request("https://developers.cuelinks.com/pub_api/v3/" + path, headers=H)
              return json.load(urllib.request.urlopen(req, timeout=30))
          def ts(s, end=False):
              s = (s or "").replace("T", " ")
              for n, f in ((19, "%Y-%m-%d %H:%M:%S"), (10, "%Y-%m-%d")):
                  try:
                      v = datetime.datetime.strptime(s[:n], f).replace(tzinfo=IST).timestamp()
                      return v + (86400 if (end and n == 10) else 0)
                  except Exception:
                      pass
              return None
          offers = []
          p = 1
          while True:
              b = api("offers?per_page=100&page=%d" % p)
              offers += b.get("data", [])
              if not b.get("meta", {}).get("next_page") or p >= 30:
                  break
              p += 1
          print("offers fetched:", len(offers))
          if len(offers) < 300:
              print("too few offers fetched, stopping without changes")
              raise SystemExit(0)
          def dest(u):
              q = urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
              for k, vals in q.items():
                  for v in vals:
                      v = urllib.parse.unquote(v)
                      if v.startswith("http"):
                          return v
              return None
          FOREIGN_NAME = re.compile(r"(\b(US|UK|SG|DE|AU|CA|UAE|AE|EU|FR|ES|IT|NL|JP|MY|ID|TH|PH|VN|HK|NZ|SA|KR)\b)")
          FOREIGN_TLD = (".co.uk", ".de", ".com.au", ".sg", ".ca", ".fr", ".es", ".it", ".nl", ".jp", ".com.my", ".co.nz", ".ae", ".com.sg", ".co.id", ".hk")
          PRODUCT = re.compile(r"/(products?|p|dp|goods|item|pd|prd)/|-p-[a-z]*\d+|/[^/]+-\d{6,}/?$", re.I)
          POP = ["ajio", "tata cliq", "nykaa", "firstcry", "pepperfry", "decathlon", "bewakoof", "pantaloons", "shopsy", "vijay sales", "titan", "boat", "jockey", "uniqlo", "biba", "havells", "oppo", "realme", "acer", "airindia", "bata", "lenskart"]
          RULES = [
              (r"smart ?watch|fitness band", "Electronics", "Smart Watches"),
              (r"earbud|earphone|headphone|neckband|airdopes|buds|speaker|soundbar", "Electronics", "Earbuds & Audio"),
              (r"laptop|monitor|keyboard|\bmouse\b", "Electronics", "Laptops & Computers"),
              (r"\btv\b|television", "Electronics", "TV & Displays"),
              (r"smartphone|mobile|\bphone\b", "Mobiles", "Smartphones"),
              (r"charger|cable|power ?bank", "Mobiles", "Chargers & Cables"),
              (r"purifier|water heater|geyser", "Appliances", "Water Heaters & Purifiers"),
              (r"refrigerator|\bac\b|air conditioner|cooler|\bfan\b|washing machine", "Appliances", "AC & Refrigerators"),
              (r"mixer|grinder|kettle|toaster|oven|air fryer|cooker", "Appliances", "Kitchen Appliances"),
              (r"saree|sari", "Women", "Sarees"),
              (r"kurti|ethnic|lehenga|salwar", "Women", "Kurtis & Ethnic Wear"),
              (r"\btoy|toys", "Kids", "Toys & Games"),
              (r"baby|diaper", "Kids", "Baby Care"),
              (r"shampoo|hair oil|conditioner", "Beauty", "Haircare"),
              (r"serum|moisturi|face wash|sunscreen|skincare|cream", "Beauty", "Skincare"),
              (r"lipstick|makeup|mascara|kajal|foundation", "Beauty", "Makeup"),
              (r"perfume|deodorant|fragrance", "Beauty", "Fragrances"),
              (r"trimmer|shaver|epilator", "Beauty", "Trimmers & Grooming Tools"),
              (r"protein|vitamin|supplement", "Health", "Vitamins & Supplements"),
              (r"yoga|dumbbell|\bgym\b", "Sports", "Gym & Yoga"),
              (r"cricket", "Sports", "Cricket & Outdoor"),
              (r"bag|backpack|wallet", "Accessories", "Bags & Wallets"),
              (r"sunglass", "Accessories", "Sunglasses"),
              (r"watch", "Accessories", "Watches"),
              (r"bottle|lunch box", "Accessories", "Bottles & Lunch Boxes"),
              (r"mattress|pillow|bedsheet|blanket", "Home", "Bedding & Furnishing"),
              (r"cookware|dinner set|bakeware", "Home", "Cookware & Dinnerware"),
              (r"detergent|\bmop\b|cleaner", "Home", "Cleaning"),
              (r"\blamp\b|led light", "Home", "Lighting"),
              (r"snack|nuts|\btea\b|coffee|masala", "Grocery", "Snacks & Food"),
              (r"\bbook|stationery", "Stationery", "Books"),
              (r"helmet", "Auto", "Helmets"),
              (r"luggage|trolley", "Luggage", "Luggage & Trolley"),
          ]
          def classify(text):
              t = (text or "").lower()
              for pat, c, sub in RULES:
                  if re.search(pat, t):
                      return c, sub
              return "Others", "Other"
          cand = {}
          for o in offers:
              if o.get("offer_type") != "deal" or o.get("coupon_code"):
                  continue
              e = ts(o.get("end_date"), True)
              if e and e < NOW:
                  continue
              d = dest(o.get("tracking_url") or "")
              if not d:
                  continue
              host = urllib.parse.urlparse(d).netloc.lower()
              if FOREIGN_NAME.search(o.get("campaign_name") or "") or host.endswith(FOREIGN_TLD):
                  continue
              if not PRODUCT.search(urllib.parse.urlparse(d).path):
                  continue
              cand["cl_" + str(o.get("id"))] = (o, d)
          all_ids = set("cl_" + str(o.get("id")) for o in offers)
          print("candidate product deals:", len(cand))
          firebase_admin.initialize_app(credentials.Certificate(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])))
          db = firestore.client()
          col = db.collection("autodeals")
          dcol = db.collection("deals")
          sref = db.collection("autodeals_meta").document("state")
          snap = sref.get()
          sd = (snap.to_dict() or {}) if snap.exists else {}
          state = sd.get("ids", {})
          migrate = sd.get("v") != 4
          def meta(html, prop):
              for pat in (r'<meta[^>]+(?:property|name)=["\']%s["\'][^>]+content=["\']([^"\']*)' % prop, r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+(?:property|name)=["\']%s["\']' % prop):
                  m = re.search(pat, html, re.I)
                  if m:
                      return m.group(1)
              return None
          def money(v):
              try:
                  x = float(str(v).replace(",", "").strip())
                  return x if 0 < x < 10000000 else None
              except Exception:
                  return None
          def text_price(text):
              for m in re.finditer(r"(?:Rs\.?|INR|\u20b9)\s?([\d,]+(?:\.\d+)?)", text or "", re.I):
                  before = (text[max(0, m.start() - 14):m.start()]).lower()
                  if re.search(r"save|off|flat|upto|up to|cashback|worth|extra|get\s*$|min|above|over", before):
                      continue
                  v = money(m.group(1))
                  if v:
                      return v
              return None
          def check(item):
              o, d = item
              try:
                  r = urllib.request.Request(d, headers={"User-Agent": UA2})
                  html = urllib.request.urlopen(r, timeout=10).read(300000).decode("utf-8", "ignore")
              except Exception:
                  return ("pending", "blocked", "", None)
              img = meta(html, "og:image")
              typ = (meta(html, "og:type") or "").lower()
              full = urllib.parse.urljoin(d, img.strip()) if img else ""
              if full.startswith("http://"):
                  full = "https://" + full[7:]
              if not re.match(r"^https://[^\s\"'<>]{4,900}$", full):
                  full = ""
              price = None
              for k in ("product:price:amount", "og:price:amount", "product:sale_price:amount"):
                  price = money(meta(html, k))
                  if price:
                      break
              if not price:
                  price = text_price((o.get("title") or "") + " . " + (o.get("description") or ""))
              if full.startswith("http") and "product" in typ and price:
                  return ("live", "", full, price)
              if not full:
                  return ("pending", "noimage", "", price)
              if "product" not in typ:
                  return ("pending", "notproduct", full, price)
              return ("pending", "noprice", full, price)
          if migrate:
              state = {}
          new_ids = [i for i in cand if i not in state][:300]
          with ThreadPoolExecutor(8) as ex:
              results = list(ex.map(check, [cand[i] for i in new_ids]))
          batch = db.batch()
          n = 0
          def commit():
              global batch, n
              if n:
                  batch.commit()
                  batch = db.batch()
                  n = 0
          def live_doc(o, d, img, name, cat, sub, e, price):
              ms = int(NOW * 1000)
              return {"title": (o.get("title") or "")[:200], "category": cat, "sub": sub, "source": "Other", "oldPrice": 0, "newPrice": price, "viewUrl": d, "link": o.get("tracking_url"), "desc": (o.get("description") or "")[:400], "imgs": [img], "createdAt": ms, "checkedAt": ms, "expiresAt": int(e * 1000) if e else 0, "coupon": "", "extra": "", "offerText": name, "videoUrl": "", "pinned": False, "pick": False, "pk": 0, "ended": False, "sample": False, "offers": [], "noGame": False, "inGame": False, "allowCmt": False, "auto": True}
          counts = {"live": 0, "pending": 0, "deleted_gone": 0, "deleted_7d": 0}
          if migrate:
              gone = 0
              for dd in dcol.where("auto", "==", True).stream():
                  xd = dd.to_dict() or {}
                  im0 = (xd.get("imgs") or [""])[0]
                  if not xd.get("newPrice") or not str(im0).startswith("https://"):
                      batch.delete(dcol.document(dd.id))
                      n += 1
                      gone += 1
                      if n >= 400:
                          commit()
              for dd in col.stream():
                  batch.delete(col.document(dd.id))
                  n += 1
                  if n >= 400:
                      commit()
              commit()
              print("v4 reset: removed auto deals without price:", gone)
          for i, res in zip(new_ids, results):
              o, d = cand[i]
              status, reason, img, price = res
              name = o.get("campaign_name") or ""
              cat, sub = classify((o.get("title") or "") + " " + (o.get("description") or ""))
              e = ts(o.get("end_date"), True)
              if status == "live":
                  batch.set(dcol.document(i), live_doc(o, d, img, name, cat, sub, e, price))
              else:
                  doc = {"source": "cuelinks", "offerId": str(o.get("id")), "title": (o.get("title") or "")[:200], "description": (o.get("description") or "")[:400], "store": name, "popular": any(x in name.lower() for x in POP), "cat": cat, "sub": sub, "link": o.get("tracking_url"), "viewUrl": d, "image": "", "hint": img, "price": price or 0, "status": status, "reason": reason, "endDate": o.get("end_date"), "offerCreated": o.get("created_at"), "firstSeen": firestore.SERVER_TIMESTAMP, "firstSeenMs": int(NOW * 1000)}
                  batch.set(col.document(i), doc)
              n += 1
              state[i] = {"s": status, "t": int(NOW)}
              counts[status] += 1
              if n >= 400:
                  commit()
          for i, v in list(state.items()):
              if v.get("s") in ("live", "pending", "done") and i not in cand:
                  batch.delete(col.document(i))
                  batch.delete(dcol.document(i))
                  n += 2
                  state[i] = {"s": "gone", "t": v.get("t", int(NOW))}
                  counts["deleted_gone"] += 1
                  if n >= 400:
                      commit()
          for i, v in list(state.items()):
              if v.get("s") == "pending" and NOW - v.get("t", NOW) > 7 * 86400 and i in cand:
                  dsnap = col.document(i).get()
                  if not dsnap.exists:
                      state[i] = {"s": "done", "t": v.get("t", int(NOW))}
                  elif (dsnap.to_dict() or {}).get("status") == "pending":
                      batch.delete(col.document(i))
                      n += 1
                      state[i] = {"s": "gone", "t": v.get("t", int(NOW))}
                      counts["deleted_7d"] += 1
          commit()
          for i in list(state.keys()):
              if i not in all_ids:
                  del state[i]
          sref.set({"ids": state, "v": 4, "updated": firestore.SERVER_TIMESTAMP})
          print("sync done:", counts, "| tracked ids:", len(state))
          PY
