name: Deals sync
on:
  workflow_dispatch:
concurrency:
  group: deals-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install
        run: pip install firebase-admin
      - name: Remove auto deals
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os, json
          import firebase_admin
          from firebase_admin import credentials, firestore
          firebase_admin.initialize_app(credentials.Certificate(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])))
          db = firestore.client()
          batch = db.batch()
          n = 0
          removed_live = 0
          kept = 0
          removed_pending = 0
          for dd in db.collection("deals").where("auto", "==", True).stream():
              x = dd.to_dict() or {}
              im0 = str((x.get("imgs") or [""])[0])
              if im0.startswith("data:"):
                  kept += 1
                  continue
              batch.delete(db.collection("deals").document(dd.id))
              n += 1
              removed_live += 1
              if n >= 400:
                  batch.commit()
                  batch = db.batch()
                  n = 0
          for dd in db.collection("autodeals").stream():
              batch.delete(db.collection("autodeals").document(dd.id))
              n += 1
              removed_pending += 1
              if n >= 400:
                  batch.commit()
                  batch = db.batch()
                  n = 0
          batch.delete(db.collection("autodeals_meta").document("state"))
          batch.commit()
          print("removed auto deals from app:", removed_live, "| removed pending:", removed_pending, "| kept (your own approved ones):", kept)
          PY
