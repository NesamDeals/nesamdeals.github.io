name: Cuelinks test 2
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check stores and images
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse, collections
          key = os.environ.get("CUELINKS_API_KEY", "")
          UA = "TruePick-DealsSync/1.0 (+https://nesamdeals.github.io)"
          UA2 = "Mozilla/5.0 (compatible; TruePickLinkPreview/1.0; +https://nesamdeals.github.io)"
          H = {"Authorization": "Token " + key, "Accept": "application/json", "User-Agent": UA}
          def api(path):
              req = urllib.request.Request("https://developers.cuelinks.com/pub_api/v3/" + path, headers=H)
              return json.load(urllib.request.urlopen(req, timeout=30))
          offers = []
          p = 1
          while True:
              b = api("offers?per_page=100&page=%d" % p)
              offers += b.get("data", [])
              if not b.get("meta", {}).get("next_page") or p >= 15:
                  break
              p += 1
          print("offers fetched:", len(offers))
          names = collections.Counter(o.get("campaign_name") for o in offers)
          print("distinct stores:", len(names))
          low = lambda s: (s or "").lower()
          MAJ = ["amazon", "flipkart", "myntra", "meesho", "ajio", "nykaa", "tata cliq", "snapdeal", "croma", "reliance", "jiomart", "firstcry", "pepperfry", "boat", "lenskart", "bigbasket", "mamaearth", "vijay sales", "shopsy", "decathlon", "puma", "adidas", "nike", "samsung", "oneplus", "realme", "xiaomi", "mi.com", "bewakoof", "urbanic", "zivame", "purplle", "healthkart", "wakefit", "ikea", "paytm", "indiamart", "hamleys", "titan", "fabindia", "westside", "lifestyle", "pantaloons", "max fashion"]
          found = {m: sum(c for n, c in names.items() if m in low(n)) for m in MAJ}
          print("MAJOR FOUND:", {k: v for k, v in found.items() if v})
          print("MAJOR NOT FOUND:", [k for k, v in found.items() if not v])
          print("TOP 45 STORES:", names.most_common(45))
          def dest(u):
              q = urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
              for k, vals in q.items():
                  for v in vals:
                      v = urllib.parse.unquote(v)
                      if v.startswith("http"):
                          return v
              return None
          u0 = offers[0].get("tracking_url") or ""
          print("link host:", urllib.parse.urlparse(u0).netloc, "| params:", list(urllib.parse.parse_qs(urllib.parse.urlparse(u0).query).keys()))
          print("offers with destination inside link:", sum(1 for o in offers if dest(o.get("tracking_url") or "")))
          def og(url):
              try:
                  r = urllib.request.Request(url, headers={"User-Agent": UA2})
                  html = urllib.request.urlopen(r, timeout=15).read(400000).decode("utf-8", "ignore")
              except Exception as e:
                  return "ERR " + str(e)[:40]
              for pat in (r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)', r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']'):
                  m = re.search(pat, html)
                  if m:
                      return "IMAGE OK"
              return "no og:image"
          seen = set()
          for o in offers:
              d = dest(o.get("tracking_url") or "")
              s = o.get("campaign_name")
              if d and s not in seen and len(seen) < 10:
                  seen.add(s)
                  print("img test:", s, "|", urllib.parse.urlparse(d).netloc, "|", og(d))
          try:
              c = api("campaigns?per_page=100")
              items = c.get("data", [])
              print("campaigns total:", c.get("meta", {}).get("total"), "| keys:", list(items[0].keys()) if items else None)
              for it in items:
                  if any(m in low(it.get("name")) for m in ("amazon", "flipkart", "myntra", "meesho", "ajio", "nykaa")):
                      print("campaign:", {k: v for k, v in it.items() if any(t in k for t in ("name", "status", "access", "logo", "image"))})
          except Exception as e:
              print("campaigns error:", str(e)[:80])
          PY
