<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nesam Deals</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#002C9D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700;800&family=Hind+Madurai:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: royal-blue brand header (from the logo), yellow action buttons, red discount tags, swipeable photo cards in a day-grouped feed. */
  --hdr:#002C9D; --hdr-ink:#FFFFFF;
  --ink:#141B3A; --muted:#5B6385; --bg:#F2F5FC; --card:#FFFFFF; --line:#DFE4F2; --chip:#E6EBF8;
  --brand:#1546C6; --accent:#FFC20E; --accent-ink:#14213D; --hot:#D81E2D; --save:#0A8A5F;
  --shadow:0 1px 2px rgba(20,27,58,.06),0 8px 22px rgba(20,27,58,.08);
  --display:'Baloo Thambi 2','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic','Hind Madurai',system-ui,sans-serif;
  --body:'Hind Madurai','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
    --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
  --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 14px 11px}
.hdr-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;color:inherit}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.bt{display:flex;flex-direction:column;min-width:0}
.word{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;line-height:1.05;letter-spacing:-.2px}
.word b{color:var(--accent);font-weight:800}
.tag{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.hdr select{height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:0 8px;font-size:14px;font-weight:600;max-width:112px}
.hdr select option{color:#141B3A;background:#fff}
.hbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}

.wrap{max-width:1040px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.strip{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:12px}
.strip strong{font-family:var(--display);font-size:22px;color:var(--brand);line-height:1}
.strip span{color:var(--muted);font-size:14px}
.demo{background:#FFF3C4;color:#5B4500;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.slow{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px;color:var(--muted)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px 0 44px;font-size:16px}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;height:36px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;font-weight:600}
.join{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.join b{font-family:var(--display);font-size:17px}
.join a{background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:999px;padding:7px 14px;font-size:14px;margin-left:6px}

/* feed + cards */
/* view modes: big / grid / list */
.vmb{flex:none;width:38px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.vmb[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters .vsp{flex:1;min-width:4px}
.feed.vm-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feed.vm-grid .media{aspect-ratio:1/1}
.feed.vm-list{grid-template-columns:1fr;gap:10px}
.feed.vm-list .card{flex-direction:row;align-items:stretch}
.feed.vm-list .media{width:132px;flex:none;aspect-ratio:1/1;align-self:flex-start}
.feed.vm-grid .body,.feed.vm-list .body{padding:8px 10px 10px;gap:4px;min-width:0}
.feed.vm-grid .title,.feed.vm-list .title{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed.vm-grid .now,.feed.vm-list .now{font-size:19px}
.feed.vm-grid .was,.feed.vm-list .was{font-size:12.5px}
.feed.vm-grid .saving,.feed.vm-grid .desc,.feed.vm-grid .more,.feed.vm-grid .checked,.feed.vm-grid .vidbtn,.feed.vm-grid .coupon,.feed.vm-grid .extra,.feed.vm-grid .timer,.feed.vm-grid .actions .wa,
.feed.vm-list .desc,.feed.vm-list .more,.feed.vm-list .checked,.feed.vm-list .vidbtn,.feed.vm-list .coupon,.feed.vm-list .extra,.feed.vm-list .timer,.feed.vm-list .actions .wa{display:none}
.feed.vm-grid .meta span:last-child,.feed.vm-list .meta span:last-child{display:none}
.feed.vm-grid .actions,.feed.vm-list .actions{gap:6px;padding-top:2px}
.feed.vm-grid .buy,.feed.vm-list .buy{height:36px;font-size:13.5px;border-radius:10px;padding:0 6px}
.feed.vm-grid .ico,.feed.vm-list .ico{width:36px;height:36px;border-radius:10px}
.feed.vm-grid .off,.feed.vm-list .off{font-size:11.5px;padding:2px 7px;left:6px;top:6px}
.feed.vm-grid .flags,.feed.vm-list .flags{display:none}
.feed.vm-grid .ended,.feed.vm-list .ended{font-size:15px}

.feed{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.day{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:18px;margin:8px 0 -2px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day.star{color:var(--hot)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.media{position:relative;aspect-ratio:4/3;background:var(--chip)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:100%}
.slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;-webkit-user-drag:none}
.off{position:absolute;left:10px;top:10px;background:var(--hot);color:#fff;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;pointer-events:none}
.flags{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:none}
.flag{background:rgba(20,27,58,.88);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.flag.loot{background:var(--hot)}
.flag.star{background:var(--accent);color:var(--accent-ink)}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:#fff;width:18px;border-radius:6px}
.count{position:absolute;right:10px;bottom:8px;background:rgba(20,27,58,.78);color:#fff;font-size:12px;padding:1px 8px;border-radius:999px;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#141B3A;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.arrow.l{left:8px}.arrow.r{right:8px}
@media (hover:hover){.media:hover .arrow{display:grid}}
.ended{position:absolute;inset:0;background:rgba(11,16,34,.66);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;pointer-events:none;text-align:center;padding:12px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.title{margin:0;font-size:17px;font-weight:700;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.now.offer{font-size:20px;color:var(--hot)}
.was{color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.saving{color:var(--save);font-weight:700;font-size:14px}
.extra{background:color-mix(in srgb,var(--save) 14%,transparent);color:var(--save);font-weight:700;font-size:14px;border-radius:10px;padding:5px 10px}
.coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed var(--brand);border-radius:12px;padding:6px 6px 6px 12px}
.coupon small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.coupon code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:16px;letter-spacing:.5px;user-select:all;overflow-wrap:anywhere}
.coupon button{height:36px;border-radius:9px;border:0;background:var(--brand);color:#fff;font-weight:700;padding:0 14px;cursor:pointer;flex:none}
.timer{font-size:13px;font-weight:700;color:var(--hot)}
.checked{font-size:12.5px;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:15px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc.open{display:block}
.more{align-self:flex-start;background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;font-size:14px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.buy{flex:1;display:inline-flex;align-items:center;justify-content:center;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:16px;text-align:center;padding:0 10px}
.buy[aria-disabled="true"]{background:var(--chip);color:var(--muted);pointer-events:none}
.ico{width:46px;height:46px;flex:none;border-radius:13px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ico[aria-pressed="true"]{color:var(--hot);border-color:var(--hot)}
.empty{grid-column:1/-1;text-align:center;padding:42px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:4px}
.moreb{grid-column:1/-1;justify-self:center;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 22px;font-weight:700;cursor:pointer}
.back{display:inline-flex;align-items:center;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-weight:700;cursor:pointer;margin-bottom:12px}
.foot{max-width:1040px;margin:26px auto 0;color:var(--muted);font-size:13px;line-height:1.6}
.foot p{margin:0 0 6px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:56px}
.nav button[aria-current="page"]{color:var(--brand)}
.badge{background:var(--hot);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

.ptitle{font-family:var(--display);font-size:22px;margin:4px 0 4px;line-height:1.25}
.catgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.cattile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 20px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;box-shadow:var(--shadow)}
.cattile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cc,var(--brand))}
.cattile b{font-family:var(--display);font-size:18px;line-height:1.25}
.cattile span{color:var(--muted);font-size:13px}
.cattile.zero{opacity:.55}
.catbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.catbar h2{font-family:var(--display);margin:0;font-size:22px}
.catbar .back{margin:0}
.social{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;margin-bottom:10px;box-shadow:var(--shadow);max-width:560px}
.sb{width:46px;height:46px;border-radius:14px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none;font-family:var(--display)}
.sn{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.sn small{color:var(--muted)}
.go2{color:var(--brand);font-weight:700;font-size:14px;flex:none}
.srow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.srow input,.srow select{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;min-height:44px;min-width:0}
.srow button{align-self:flex-end;min-height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;padding:0 12px;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(5,8,20,.94);z-index:50;display:flex;flex-direction:column}
.lb .track{flex:1}
.lb .slide{display:grid;place-items:center;height:100%}
.lb .slide img{width:100%;height:100%;object-fit:contain;cursor:default}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;color:#fff}
.lb-top button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}

/* seller studio (admin only) */
.sbar{background:var(--hdr);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sbar b{font-family:var(--display);font-size:19px}
.sbar button{height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 14px;cursor:pointer}
.stabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.stabs button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;white-space:nowrap;padding:0 12px}
.stabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:680px}
.panel h2{font-family:var(--display);margin:0 0 12px;font-size:21px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label,.lbl{font-size:14px;font-weight:700}
.fld input,.fld select,.fld textarea{min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;min-height:44px}
.fld textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--hot);font-size:14px;font-weight:700;margin:0 0 10px}
.ok{color:var(--save);font-size:14px;font-weight:700;margin:0 0 10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.ph .first{position:absolute;left:4px;bottom:4px;border:0;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;font-size:12px;padding:2px 7px;cursor:pointer}
.ph .cov{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--accent-ink);border-radius:8px;font-size:12px;font-weight:700;padding:2px 7px}
.addph{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;text-align:center;cursor:pointer;font-weight:700;color:var(--brand);font-size:14px}
.addph input{display:none}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px}
.chk input{width:22px;height:22px}
.btns{display:flex;gap:10px;margin-top:8px}
.btns button{flex:1;height:48px;border-radius:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.btns .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns button[disabled]{opacity:.55;cursor:progress}
.lst{display:flex;flex-direction:column;gap:10px;max-width:760px}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.row img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip)}
.row .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row .t{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--chip)}
.tg.r{background:var(--hot);color:#fff}.tg.g{background:var(--save);color:#fff}.tg.y{background:var(--accent);color:var(--accent-ink)}
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.racts button{min-height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px;padding:0 10px;cursor:pointer}
.racts .del[data-arm="1"]{background:var(--hot);border-color:var(--hot);color:#fff}
.logoprev{width:72px;height:72px;border-radius:16px;background:var(--accent);object-fit:cover;display:block}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}.track{scroll-behavior:smooth}}
/* ===== v3 polish: friendlier colours, bigger touch targets, price zones, admin dashboard ===== */
body{font-size:17px}
.hdr{background:linear-gradient(120deg,var(--hdr),color-mix(in srgb,var(--hdr) 55%,var(--brand)));box-shadow:0 3px 14px rgba(0,0,0,.22)}
.word{font-size:25px}
.tag{font-size:13px}
.strip{background:linear-gradient(120deg,color-mix(in srgb,var(--brand) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}
.card{border-radius:20px;border-color:color-mix(in srgb,var(--brand) 10%,var(--line))}
.title{font-size:18px}
.now{color:var(--save);font-size:28px}
.now.offer{color:var(--hot)}
.off{background:linear-gradient(135deg,#FF3D54,#D81E2D);font-size:15px;padding:4px 11px;box-shadow:0 2px 8px rgba(216,30,45,.4)}
.buy{height:50px;font-size:17px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000),0 6px 14px rgba(0,0,0,.14);border-radius:14px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.buy[aria-disabled="true"]{box-shadow:none;background:var(--chip)}
.ico{height:50px;width:50px;border-radius:14px}
.ico.wa{color:#1FA855;border-color:#1FA855}
.chip{min-height:40px;font-size:15px}
.chip[aria-pressed="true"]{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.meta{gap:8px}
.cbadge{display:inline-flex;align-items:center;gap:4px;max-width:100%;border:0;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:#fff;background:var(--cc,var(--brand));text-align:start;line-height:1.3;font-family:inherit}
span.cbadge{cursor:default}
.ann{display:block;background:linear-gradient(120deg,#FF8A00,#D81E2D);color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:15.5px}
.zones{margin-bottom:8px}
.zt{font-family:var(--display);font-weight:700;font-size:17px;margin:2px 0 8px}
.zrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.zrow::-webkit-scrollbar{display:none}
.zone{flex:none;min-width:116px;border:0;border-radius:18px;padding:10px 12px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start;background:linear-gradient(145deg,var(--zc),color-mix(in srgb,var(--zc) 60%,#000));box-shadow:0 4px 12px color-mix(in srgb,var(--zc) 40%,transparent);font-family:inherit}
.zone .ze{font-size:22px;line-height:1}
.zone b{font-family:var(--display);font-size:17px;line-height:1.2;white-space:nowrap}
.zone small{opacity:.9;font-size:12px}
.zone[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.cattile{border-radius:18px;min-height:104px;padding:14px 14px 14px 22px;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--cc) 10%,var(--card)))}
.cattile::before{width:8px}
.cattile .ce{font-size:30px;line-height:1}
.nav button{font-size:13px}
.nav button[aria-current="page"]{color:var(--brand);font-weight:700}
.nav button[aria-current="page"] svg{transform:scale(1.12)}
.about{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;max-width:560px;white-space:pre-line}
/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px;max-width:760px}
.stat{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--sc)}
.stat span{font-size:13px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(120px,170px) 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px}
.bar b{text-align:end}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:40px}
.pk[aria-pressed="true"]{background:var(--cc,var(--brand));border-color:var(--cc,var(--brand));color:#fff}
.pk.sub{font-size:13.5px;min-height:36px}
.prev{margin-top:8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zh{margin:-4px 0 10px;color:var(--save);font-weight:700}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:84px;height:62px;border-radius:14px;border:3px solid transparent;cursor:pointer;display:flex;align-items:flex-end;padding:0}
.sw small{display:block;width:100%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 4px;border-radius:0 0 10px 10px;text-align:center}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.hidl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 12px}
.stabs{flex-wrap:wrap}
.stabs button{font-size:15px;flex:1 1 auto}
.fld input[type=checkbox]{width:22px;min-height:22px;height:22px}
.vidbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:42px;border-radius:12px;border:2px solid var(--hot);background:color-mix(in srgb,var(--hot) 8%,var(--card));color:var(--hot);font-weight:700;font-size:15px;padding:0 14px;cursor:pointer;font-family:inherit}
.vframe{flex:1;display:grid;place-items:center;padding:0 0 calc(12px + env(safe-area-inset-bottom))}
.vframe iframe{width:100%;max-width:520px;height:min(80vh,calc(100vw*1.6));border:0;background:#000}
/* right-to-left (Urdu) */
[dir=rtl] .search svg{left:auto;right:14px}
[dir=rtl] .search input{padding:0 44px 0 16px}
[dir=rtl] .cattile{padding:14px 22px 14px 14px}
[dir=rtl] .cattile::before{left:auto;right:0}
[dir=rtl] .off{left:auto;right:10px}
[dir=rtl] .flags{right:auto;left:10px}
.media,.lb .track{direction:ltr}

  function makeTrack(imgs,title,onTap){
    var track=h('div',{class:'track',tabindex:'0','aria-label':title||''});
    imgs.forEach(function(src,i){
      track.append(h('div',{class:'slide'},h('img',{src:src,alt:(title||'')+' '+(i+1),loading:'lazy',draggable:'false',onclick:function(){if(onTap) onTap(i)}})));
    });

  }
  function gallery(d){
    var imgs=dealImgs(d); if(!imgs.length) imgs=[PLACEHOLDER];
    var media=h('div',{class:'media'});
    var track=makeTrack(imgs,dTitle(d),imgs[0]===PLACEHOLDER?null:function(i){openLightbox(imgs,i,dTitle(d))});
    media.append(track);
    if(imgs.length>1){
      var dots=h('div',{class:'dots'}); imgs.forEach(function(_,i){dots.append(h('i',{class:i===0?'on':''}))});
      var count=h('span',{class:'count'},'1/'+imgs.length);
      var cur=0,raf=0;
      function go(i){ i=Math.max(0,Math.min(imgs.length-1,i)); track.scrollTo({left:i*track.clientWidth,behavior:'smooth'}); }
      track.addEventListener('scroll',function(){
        if(raf) return;
        raf=requestAnimationFrame(function(){
          raf=0; var i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
          if(i!==cur){ cur=i; Array.prototype.forEach.call(dots.children,function(x,j){x.className=j===i?'on':''}); count.textContent=(i+1)+'/'+imgs.length; }
        });
      });
      track.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
      media.append(dots,count,
        h('button',{class:'arrow l',type:'button','aria-label':'Previous photo',onclick:function(){go(cur-1)}},svgIcon(P.left,20,2.4)),
        h('button',{class:'arrow r',type:'button','aria-label':'Next photo',onclick:function(){go(cur+1)}},svgIcon(P.right,20,2.4)));
    }
    return media;
  }
  function openLightbox(imgs,start,title){
    var track=makeTrack(imgs,title,null),cnt=h('span',null,(start+1)+'/'+imgs.length);
    var lb=h('div',{class:'lb',role:'dialog','aria-modal':'true'},
      h('div',{class:'lb-top'},cnt,h('button',{type:'button','aria-label':'Close',onclick:close},'×')),track);
    function close(){lb.remove();document.removeEventListener('keydown',key)}
    function key(e){if(e.key==='Escape') close()}
    document.addEventListener('keydown',key);
    track.addEventListener('scroll',function(){cnt.textContent=(Math.round(track.scrollLeft/Math.max(1,track.clientWidth))+1)+'/'+imgs.length});
    document.body.append(lb);
    track.style.scrollBehavior='auto'; track.scrollLeft=start*track.clientWidth;
  }

  function readFile(f){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(f)})}
  function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=src})}
  async function encode(src,dim,q,png){
    var im=await loadImg(src),s=Math.min(1,dim/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*s)); c.height=Math.max(1,Math.round(im.height*s));
    var x=c.getContext('2d'); if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    return png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q);
  }
  async function fitPhotos(srcs){
    function total(a){return a.reduce(function(n,s){return n+s.length},0)}
    if(total(srcs)<=IMG_BUDGET) return srcs;
    var lv=[[640,.66],[560,.6],[480,.55],[420,.5],[360,.45],[300,.4],[260,.35]];
    for(var i=0;i<lv.length;i++){
      var out=[]; for(var j=0;j<srcs.length;j++) out.push(await encode(srcs[j],lv[i][0],lv[i][1]));
      if(total(out)<=IMG_BUDGET) return out;
    }
    return null;
  }

  function appName(){return String((S.settings&&S.settings.appName)||'').trim()||'Nesam Deals'}
  function applyTheme(){
    var th=THEMES.filter(function(x){return x.id===((S.settings&&S.settings.theme)||'blue')})[0]||THEMES[0],r=document.documentElement.style;
    var forced=document.documentElement.getAttribute('data-theme');
    var dark=forced?forced==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    r.setProperty('--hdr',dark?'color-mix(in srgb,'+th.hdr+' 55%,#000)':th.hdr);
    r.setProperty('--brand',dark?th.bd:th.brand);
    r.setProperty('--accent',th.acc);
  }
  function renderChrome(){
    rebuildTax(); applyTheme();
    document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==='ur'?'rtl':'ltr';
    var nm=appName(),parts=nm.split(/\s+/),first=parts.shift(),rest=parts.join(' ');
    var w=$('word'); w.replaceChildren(first+(rest?' ':''),rest?h('b',null,rest):null);
    document.title=nm; $('brand').setAttribute('aria-label',nm);
    $('tagline').textContent=String((S.settings&&S.settings.tagline)||'').trim()||t('tagline');
    $('q').placeholder=t('search');
    $('nav-home').textContent=t('navDeals'); $('nav-saved').textContent=t('navSaved'); $('nav-cats').textContent=t('navCats'); $('nav-follow').textContent=t('navFollow');
    var mk=$('mark'); mk.replaceChildren();
    var lg=S.settings.logo&&/^data:image\//.test(S.settings.logo)?S.settings.logo:'';
    if(!lg&&S.hosted) lg='logo.png';
    if(lg) mk.append(h('img',{src:lg,alt:''}));
    else { var c=svgIcon(P.cart,24,2.3); c.style.color='#D81E2D'; mk.append(c); }
    $('sellerBtn').hidden=!S.admin||S.view==='seller';
    var sel=$('lang');
    if(!sel.options.length){
      LANGS.forEach(function(l){sel.append(h('option',{value:l[0]},l[1]))});
      sel.addEventListener('change',function(){S.lang=sel.value;lsSet('nesam-lang',S.lang);render()});
    }
    sel.value=S.lang;
  }
  function render(){
    renderChrome();
    var seller=S.view==='seller'&&S.admin;
    $('shop').hidden=seller; $('seller').hidden=!seller; $('nav').hidden=seller||!!S.focus;
    if(seller) renderSeller(); else renderShop();
  }
  function route(){
    var hsh=(location.hash||'').replace(/^#/,'');
    S.focus=''; S.view='shop';
    if(hsh==='seller'&&S.admin) S.view='seller';
    else if(/^deal-[A-Za-z0-9_-]+$/.test(hsh)) S.focus=hsh.slice(5);
    render(); window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);

  $('q').addEventListener('input',function(e){S.q=e.target.value;renderShop()});
  $('tab-home').addEventListener('click',function(){S.tab='home';S.zone='';render();window.scrollTo(0,0)});
  $('tab-saved').addEventListener('click',function(){S.tab='saved';render();window.scrollTo(0,0)});
  $('tab-cats').addEventListener('click',function(){S.tab='cats';S.main='';S.sub='';S.zone='';render();window.scrollTo(0,0)});
  $('tab-follow').addEventListener('click',function(){S.tab='follow';render();window.scrollTo(0,0)});
  $('sellerBtn').addEventListener('click',function(){location.hash='seller';route()});
  var taps=0,tapT;
  $('brand').addEventListener('click',function(){
    if(S.live){
      if(S.hosted&&!S.admin){taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0},1500);if(taps>=5){taps=0;hostedLogin();return}}
      if(S.view!=='shop'||S.focus){location.hash='home';route()} else window.scrollTo(0,0);
      return;
    }
    taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0},1500);
    if(taps>=5){taps=0;S.admin=!S.admin;if(!S.admin&&S.view==='seller'){location.hash='home'}toast(S.admin?'Demo seller ON':'Demo seller OFF');route()}
  });

  async function hostedLogin(){
    try{
      var r=await window.NESAM.signIn();
      if(r&&r.signedIn&&!r.admin){ toast('இந்த கணக்குக்கு அட்மின் அனுமதி இல்ல'); try{await window.NESAM.signOut()}catch(e){} }
    }catch(e){ toast('லாகின் ஆகல. மறுபடி முயற்சி பண்ணுங்க.'); }
  }

  /* ============ boot ============ */
  var hasLang=lsGet('nesam-lang',null);
  var savedLang=hasLang||'ta'; S.lang=T[savedLang]?savedLang:'ta';
  S.saved=new Set(lsGet('nesam-saved',[]));{var _vm=lsGet('nesam-vm','grid');S.vm=(_vm==='big'||_vm==='list')?_vm:'grid';}
  function applyDefLang(){
    if(hasLang) return;
    var dl=S.settings&&S.settings.defLang;
    if(dl&&T[dl]&&S.lang!==dl) S.lang=dl;
  }
  render();

  function startDemo(){
    S.live=false;S.loading=false;
    var stored=lsGet('nesam-demo-deals',null);
    S.deals=Array.isArray(stored)?stored:demoSeed();
    S.deals=S.deals.filter(function(d){return !isExpired(d)}); demoPersist();
    S.settings=lsGet('nesam-settings',{})||{};
    applyDefLang();
    route();
  }
  function subscribeDeals(){
    if(S.unsub){try{S.unsub()}catch(e){}}
    var slowT=setTimeout(function(){S.slow=true;render()},10000);
    S.unsub=S.db.collection('deals').orderBy('createdAt','desc').limit(S.limit).onSnapshot(function(snap){
      clearTimeout(slowT);
      S.deals=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
      S.hitLimit=snap.size>=S.limit; S.loading=false;S.slow=false;
      if(S.admin&&!S.cleaned){S.cleaned=true;cleanupOld();}
      if(S.view==='seller'&&S.stab==='new') { renderChrome(); return; }
      render();
    },function(){
      clearTimeout(slowT); S.loading=false;S.slow=false;S.deals=[];render();toast(t('failed'));
    });
  }
  (async function init(){
    var db=null,user=null;
    try{
      if(window.claude&&window.claude.use){ db=await window.claude.use('db'); user=await window.claude.use('user'); }
    }catch(e){}
    if(!db&&!window.claude&&location.protocol!=='file:'){
      /* hosted site / installed app: Firebase adapter is loaded by a module script */
      await new Promise(function(res){ if(window.NESAM) return res(); window.addEventListener('nesam-ready',res,{once:true}); setTimeout(res,8000); });
      if(window.NESAM){ db=window.NESAM.db; S.hosted=true; }
      else { S.loading=false; S.deals=[]; render(); toast(t('failed')); return; }
    }
    if(!db){startDemo();return}
    S.live=true;S.db=db;
    try{S.admin=!!(user&&user.canEdit&&user.canEdit())}catch(e){S.admin=false}
    if(S.hosted){
      window.NESAM.onAuth(function(isAdmin,info){
        var was=S.admin; S.admin=!!isAdmin;
        if(S.admin&&!was){ toast('வணக்கம்! 🛠️ அட்மின் பட்டன் மேல இருக்கு'); if(!S.cleaned&&!S.loading){S.cleaned=true;cleanupOld();} }
        if(!S.admin&&S.view==='seller'){ location.hash='home'; }
        route();
      });
    }
    db.doc('settings/app').onSnapshot(function(snap){
      S.settings=(snap.exists&&snap.data())||{}; SET.init=false; applyDefLang();
      if(!(S.view==='seller'&&S.stab!=='list'&&S.stab!=='dash')) render(); else renderChrome();
    },function(){});
    subscribeDeals();
    route();
  })();
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection as fcol,doc as fdoc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,getDocs,onSnapshot,query,where as fwhere,orderBy as forder,limit as flimit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut as fsignOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyBRGSq_RwBD2YEGtL9_Nds3L50J6OFsBTM",
  authDomain:"nesamdeal.firebaseapp.com",
  projectId:"nesamdeal",
  storageBucket:"nesamdeal.firebasestorage.app",
  messagingSenderId:"633779911443",
  appId:"1:633779911443:web:75e803e921f3499e5e38e6"
};
const app=initializeApp(firebaseConfig);
let fs;
try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=getFirestore(app)}
const auth=getAuth(app);
const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),size:s.size});

class Q{
  constructor(name,cs){this.name=name;this.cs=cs||[]}
  where(f,o,v){return new Q(this.name,this.cs.concat([fwhere(f,o,v)]))}
  orderBy(f,d){return new Q(this.name,this.cs.concat([forder(f,d||'asc')]))}
  limit(n){return new Q(this.name,this.cs.concat([flimit(n)]))}
  _q(){return query(fcol(fs,this.name),...this.cs)}
  get(){return getDocs(this._q()).then(wrap)}
  onSnapshot(ok,err){return onSnapshot(this._q(),s=>ok(wrap(s)),err)}
}
const db={
  collection(name){
    const q=new Q(name);
    return {
      add:d=>addDoc(fcol(fs,name),d),
      doc:id=>({set:d=>setDoc(fdoc(fs,name,id),d),update:p=>updateDoc(fdoc(fs,name,id),p),delete:()=>deleteDoc(fdoc(fs,name,id))}),
      where:(f,o,v)=>q.where(f,o,v),orderBy:(f,d)=>q.orderBy(f,d),limit:n=>q.limit(n),get:()=>q.get(),onSnapshot:(a,b)=>q.onSnapshot(a,b)
    };
  },
  doc(path){
    const [c,i]=path.split('/'),ref=fdoc(fs,c,i);
    return {set:d=>setDoc(ref,d),onSnapshot:(ok,err)=>onSnapshot(ref,s=>ok({exists:s.exists(),data:()=>s.data()}),err)};
  }
};
/* Admin test: the Firestore rules only let the owner's Google account read admin/ping. Nobody else can. */
async function checkAdmin(u){
  if(!u) return false;
  const key='nesam-adm-'+u.uid;
  try{ await getDoc(fdoc(fs,'admin','ping')); try{localStorage.setItem(key,'1')}catch(e){} return true; }
  catch(e){
    if(e&&e.code==='permission-denied'){ try{localStorage.removeItem(key)}catch(x){} return false; }
    try{return localStorage.getItem(key)==='1'}catch(x){return false}
  }
}
const provider=new GoogleAuthProvider();
window.NESAM={
  db,
  onAuth(cb){ onAuthStateChanged(auth,async u=>{ cb(await checkAdmin(u),u); }); },
  async signIn(){
    try{ const r=await signInWithPopup(auth,provider); return {signedIn:true,admin:await checkAdmin(r.user)}; }
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){ await signInWithRedirect(auth,provider); return {signedIn:false}; }
      throw e;
    }
  },
  signOut(){ return fsignOut(auth); }
};
window.dispatchEvent(new Event('nesam-ready'));
if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
