<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TruePick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#002C9D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700;800&family=Arima+Madurai:wght@700;800&family=Kavivanar&family=Noto+Serif+Tamil:wght@700;800&family=Mukta+Malar:wght@700;800&family=Hind+Madurai:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: royal-blue brand header (from the logo), yellow action buttons, red discount tags, swipeable photo cards in a day-grouped feed. */
  --hdr:#002C9D; --hdr-ink:#FFFFFF;
  --ink:#141B3A; --muted:#5B6385; --bg:#F2F5FC; --card:#FFFFFF; --line:#DFE4F2; --chip:#E6EBF8;
  --brand:#1546C6; --accent:#FFC20E; --accent-ink:#14213D; --hot:#D81E2D; --save:#0A8A5F;
  --shadow:0 1px 2px rgba(20,27,58,.06),0 8px 22px rgba(20,27,58,.08);
  --display:'Baloo Thambi 2','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic','Hind Madurai',system-ui,sans-serif;
  --body:'Hind Madurai','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
    --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
  --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 14px 11px}
.hdr-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;color:inherit}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.bt{display:flex;flex-direction:column;min-width:0}
.word{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;line-height:1.05;letter-spacing:-.2px}
.word b{color:var(--accent);font-weight:800}
.tag{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:5px;flex:none}
.brand{min-width:0;flex:1 1 auto}
@media (max-width:430px){.word,.word b{font-size:21px!important}.tag{white-space:normal!important;font-size:11.5px!important;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#lang{width:80px!important;max-width:80px!important;font-size:12px!important}.hdr-r{gap:4px}.hdr-r .hbtn{width:34px;height:34px}.tag{font-size:10.5px!important}.hdr-in{gap:8px}}
@media (max-width:375px){#lang{width:66px!important;max-width:66px!important}.tag{font-size:10px!important}}
.hdr-r .hbtn{width:36px;height:36px;border-radius:11px}
#lang{max-width:96px!important;height:36px!important;padding:0 4px!important;font-size:13px!important}
.hdr select{height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:0 8px;font-size:14px;font-weight:600;max-width:112px}
.hdr select option{color:#141B3A;background:#fff}
.hbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}

.wrap{max-width:1040px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.strip{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:12px}
.strip strong{font-family:var(--display);font-size:22px;color:var(--brand);line-height:1}
.strip span{color:var(--muted);font-size:14px}
.demo{background:#FFF3C4;color:#5B4500;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.slow{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px;color:var(--muted)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px 0 44px;font-size:16px}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;height:36px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;font-weight:600}
.join{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.join b{font-family:var(--display);font-size:17px}
.join a{background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:999px;padding:7px 14px;font-size:14px;margin-left:6px}

/* feed + cards */
.tov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;justify-content:flex-end;align-items:flex-start;padding:66px 12px 0}
.tbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tbox .ttl{font-weight:800;padding:8px 10px 6px;font-family:var(--display)}
.topt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:10px;border:0;background:none;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:start}
.topt[aria-pressed="true"]{background:var(--chip);outline:2px solid var(--brand)}
.xstats{display:block;width:100%;max-width:680px}
.xsrange{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.xsrange button{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;color:var(--ink)}.xsrange button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.xsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.xscard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.xscard b{font-size:26px;font-family:var(--display)}.xscard span{font-size:13px;color:var(--mute,#64748B)}
.xsbars{display:flex;align-items:flex-end;gap:4px;height:84px;margin:10px 0 4px}.xsb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;height:100%}.xsb i{width:100%;display:block;border-radius:3px 3px 0 0;min-height:1px}.xsb small{font-size:9px;color:var(--mute,#64748B)}.xsleg{display:flex;gap:14px;font-size:12px;font-weight:700}
.xstab{width:100%;border-collapse:collapse;font-size:13px}.xstab th,.xstab td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}.xstab td:first-child{text-align:start;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xsrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.xsrow span{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xsbar2{flex:1;height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.xsbar2 i{display:block;height:100%;background:var(--brand)}
.ov{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.ov.mid{align-items:center;padding:16px}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto;box-shadow:0 -6px 30px rgba(0,0,0,.3)}
.ov.mid .sheet{border-radius:20px}
.cmprow{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.cmprow.low{border-color:#16A34A;background:rgba(22,163,74,.08)}
.cmprow .nm{font-weight:700}.cmprow .pr{font-size:20px;font-weight:800;font-family:var(--display)}.cmprow small{display:block;color:var(--mute,#64748B)}
.cmprow a{margin-inline-start:auto;padding:12px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.badge-low{background:#16A34A;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
.cmpb{width:100%;min-height:40px;margin:6px 0;border-radius:12px;border:1.5px solid var(--brand);background:none;color:var(--brand);font-weight:700;cursor:pointer}
.gdot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#E11D48;animation:gpulse 1.3s infinite}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.7)}70%{box-shadow:0 0 0 9px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
@media (prefers-reduced-motion:reduce){.gdot{animation:none}}
.gopt{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.gopt:disabled{font-size:20px;color:var(--ink);opacity:1;cursor:default}
.gopt.ok{border-color:#16A34A;background:rgba(22,163,74,.15)}.gopt.bad{border-color:#F59E0B;background:rgba(245,158,11,.14)}
.gimg{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--chip);display:block}
.wdots{display:flex;gap:6px;justify-content:center;margin:12px 0}.wdots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.wdots i.on{background:var(--brand);width:22px}
.wbig{font-size:60px;text-align:center;line-height:1.1}
.wgo,.pgo{display:block;width:100%;min-height:48px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;text-align:center;line-height:48px}
.wskip{background:none;border:0;color:var(--mute,#64748B);font-weight:700;padding:10px;cursor:pointer;font-size:15px}
.bbox{max-height:80vh;overflow:auto;min-width:290px;max-width:94vw}
.nrow{padding:8px 10px;border-top:1px solid var(--line)}
.nlab{font-weight:700;font-size:14px;margin-bottom:6px}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nnone{padding:10px;color:var(--mute,#64748B);font-size:14px}
.nmark{margin:4px 10px 8px}
.tsw{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.remb{display:block;width:100%;text-align:start;margin:0 0 12px;padding:12px 14px;border-radius:12px;border:1.5px solid #F59E0B;background:#FEF3C7;color:#7C2D12;font-weight:700;font-size:14px;cursor:pointer;grid-column:1/-1}
[data-theme=dark] .remb{background:#3A2A0A;color:#FCD34D}
/* view modes: big / grid / list */
.vmb{flex:none;width:38px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.vmb[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters .vsp{flex:1;min-width:4px}
.feed.vm-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feed.vm-grid .media{aspect-ratio:1/1}
.feed.vm-list{grid-template-columns:1fr;gap:10px}
.feed.vm-list .card{flex-direction:row;align-items:stretch}
.feed.vm-list .media{width:132px;flex:none;aspect-ratio:1/1;align-self:flex-start}
.feed.vm-grid .body,.feed.vm-list .body{padding:8px 10px 10px;gap:4px;min-width:0}
.feed.vm-grid .title,.feed.vm-list .title{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed.vm-grid .now,.feed.vm-list .now{font-size:19px}
.feed.vm-grid .was,.feed.vm-list .was{font-size:12.5px}
.feed.vm-grid .saving,.feed.vm-grid .desc,.feed.vm-grid .more,.feed.vm-grid .checked,.feed.vm-grid .vidbtn,.feed.vm-grid .coupon,.feed.vm-grid .extra,.feed.vm-grid .timer,.feed.vm-grid .actions .wa,
.feed.vm-list .desc,.feed.vm-list .more,.feed.vm-list .checked,.feed.vm-list .vidbtn,.feed.vm-list .coupon,.feed.vm-list .extra,.feed.vm-list .timer,.feed.vm-list .actions .wa{display:none}
.feed.vm-grid .meta span:last-child,.feed.vm-list .meta span:last-child{display:none}
.feed.vm-grid .actions,.feed.vm-list .actions{gap:6px;padding-top:2px}
.feed.vm-grid .buy,.feed.vm-list .buy{height:36px;font-size:13.5px;border-radius:10px;padding:0 6px}
.feed.vm-grid .ico,.feed.vm-list .ico{width:36px;height:36px;border-radius:10px}
.feed.vm-grid .off,.feed.vm-list .off{font-size:11.5px;padding:2px 7px;left:6px;top:6px}
.feed.vm-grid .flags,.feed.vm-list .flags{display:none}
.feed.vm-grid .ended,.feed.vm-list .ended{font-size:15px}

.feed{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.day{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:18px;margin:8px 0 -2px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day.star{color:var(--hot)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.media{position:relative;aspect-ratio:4/3;background:var(--chip)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:100%}
.slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;-webkit-user-drag:none}
.off{position:absolute;left:10px;top:10px;background:var(--hot);color:#fff;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;pointer-events:none}
.flags{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:none}
.flag{background:rgba(20,27,58,.88);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.flag.loot{background:var(--hot)}
.flag.star{background:var(--accent);color:var(--accent-ink)}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:#fff;width:18px;border-radius:6px}
.count{position:absolute;right:10px;bottom:8px;background:rgba(20,27,58,.78);color:#fff;font-size:12px;padding:1px 8px;border-radius:999px;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#141B3A;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.arrow.l{left:8px}.arrow.r{right:8px}
@media (hover:hover){.media:hover .arrow{display:grid}}
.ended{position:absolute;inset:0;background:rgba(11,16,34,.66);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;pointer-events:none;text-align:center;padding:12px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.title{margin:0;font-size:17px;font-weight:700;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.now.offer{font-size:20px;color:var(--hot)}
.was{color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.saving{color:var(--save);font-weight:700;font-size:14px}
.extra{background:color-mix(in srgb,var(--save) 14%,transparent);color:var(--save);font-weight:700;font-size:14px;border-radius:10px;padding:5px 10px}
.coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed var(--brand);border-radius:12px;padding:6px 6px 6px 12px}
.coupon small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.coupon code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:16px;letter-spacing:.5px;user-select:all;overflow-wrap:anywhere}
.coupon button{height:36px;border-radius:9px;border:0;background:var(--brand);color:#fff;font-weight:700;padding:0 14px;cursor:pointer;flex:none}
.timer{font-size:13px;font-weight:700;color:var(--hot)}
.checked{font-size:12.5px;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:15px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc.open{display:block}
.more{align-self:flex-start;background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;font-size:14px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.buy{flex:1;display:inline-flex;align-items:center;justify-content:center;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:16px;text-align:center;padding:0 10px}
.buy[aria-disabled="true"]{background:var(--chip);color:var(--muted);pointer-events:none}
.ico{width:46px;height:46px;flex:none;border-radius:13px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ico[aria-pressed="true"]{color:var(--hot);border-color:var(--hot)}
.empty{grid-column:1/-1;text-align:center;padding:42px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:4px}
.moreb{grid-column:1/-1;justify-self:center;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 22px;font-weight:700;cursor:pointer}

.splring{position:absolute;width:76px;height:76px;border-radius:22px;border:3px solid var(--accent);opacity:0;animation:splring 1s .35s ease-out both}
.splw{font-family:var(--display);font-weight:800;font-style:italic;font-size:46px;line-height:1.05;letter-spacing:-.4px;color:#fff;white-space:nowrap;display:flex;flex-wrap:nowrap;gap:.28em}
.splr{display:flex}
.splw.one{flex-direction:row!important;gap:0!important}
.splw .sy{color:var(--accent)}
@media (max-width:540px){.splw{flex-direction:column;gap:0}}
.splg.cu{flex-direction:column;gap:18px}
.splg.cu .splw,.splg.cu .splw.cu{flex-direction:column;align-items:center;gap:.05em;text-align:center}
.splg.cu .splr{justify-content:center}
.splw span{display:inline-block;opacity:0;transform-origin:50% 100%;animation:spldrop .75s cubic-bezier(.25,1.2,.4,1) both}
.splwrap{position:relative;display:flex;align-items:center}
.spltag{position:absolute;bottom:-34vh;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:14px;opacity:0;animation:splfade .6s 1s both}
@keyframes splpop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes splring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
@keyframes spldrop{0%{opacity:0;transform:translateY(-80px) scale(.3) rotate(-16deg);text-shadow:0 0 0 rgba(255,255,255,0)}45%{opacity:1;transform:translateY(10px) scale(1.3,.75) rotate(5deg);text-shadow:0 0 22px rgba(255,255,255,.95)}65%{transform:translateY(-9px) scale(.9,1.12) rotate(-3deg)}82%{transform:translateY(2px) scale(1.04,.97)}100%{opacity:1;transform:none;text-shadow:0 0 0 rgba(255,255,255,0)}}
@keyframes splwave{0%{opacity:1;transform:none}40%{opacity:1;transform:translateY(-14px) scale(1.12)}100%{opacity:1;transform:none}}
.splheart{position:absolute;left:50%;top:-96px;margin-left:-34px;width:68px;text-align:center;font-size:58px;line-height:1;opacity:0;transform:scale(0);pointer-events:none}
.splheart.on{animation:splbeat 1.1s ease-out both}
@keyframes splbeat{0%{opacity:0;transform:scale(0)}25%{opacity:1;transform:scale(1.5)}42%{transform:scale(1)}58%{transform:scale(1.3)}75%,100%{opacity:1;transform:scale(1)}}
.splp{position:absolute;left:50%;top:50%;font-size:22px;opacity:0;pointer-events:none;animation:splfly 1.3s ease-out both}
@keyframes splfly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1)}}
.splm.beat{animation:splmbeat .9s ease-in-out both}
@keyframes splmbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.22)}45%{transform:scale(1)}65%{transform:scale(1.15)}}
@keyframes splshine{to{transform:translateX(120%)}}
@keyframes splfade{to{opacity:1}}
</style>

<script>
(function(){
  function ls(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  var DEF_EMO=['\u2764\uFE0F','\uD83D\uDC9B','\u2728','\uD83D\uDC96','\uD83E\uDDE1','\u2728','\u2764\uFE0F','\uD83D\uDC9B','\uD83D\uDC96','\u2728','\uD83E\uDDE1','\u2764\uFE0F','\u2728','\uD83D\uDC9B'];
  window.NSPL_FONTS={'':["var(--display)",'italic'],'arima':["'Arima Madurai',var(--display)",'normal'],'kavi':["'Kavivanar',var(--display)",'normal'],'serif':["'Noto Serif Tamil',var(--display)",'normal'],'mukta':["'Mukta Malar',var(--display)",'normal']};
  function gr(str){ str=String(str||''); try{ if(window.Intl&&Intl.Segmenter){ var o=[],sg=new Intl.Segmenter('ta',{granularity:'grapheme'}); for(var x of sg.segment(str)) o.push(x.segment); return o } }catch(e){} return Array.from(str) }
  function emojis(str){ var out=[]; if(!str) return out; try{ if(window.Intl&&Intl.Segmenter){ var sg=new Intl.Segmenter('en',{granularity:'grapheme'}); for(var x of sg.segment(String(str))){ var g=x.segment; if(g.trim()&&g!==','&&g!=='\uFE0F') out.push(g) } return out } }catch(e){} return Array.from(String(str)).filter(function(g){return g.trim()&&g!==','&&g!=='\uFE0F'}) }
  window.NSPL=function(cfg,preview){
    var old=document.getElementById('spl'); if(old) old.remove();
    var custom=!!cfg,el=document.createElement('div');
    el.className='spl'; el.id='spl'; el.setAttribute('aria-hidden','true');
    el.innerHTML='<div class="splwrap"><div class="splring"></div><div class="splheart" id="splheart"></div><div class="splg'+(custom?' cu':'')+'" id="splg"><div class="splm" id="splm"></div><div class="splw" id="splw"></div></div></div>';
    document.body.appendChild(el);
    var bg=(custom&&cfg.bg)||ls('nesam-hdr'); if(bg&&typeof bg==='string') el.style.backgroundColor=bg;
    var l1,l2,one=false;
    if(custom){ l1=String(cfg.l1||''); l2=String(cfg.l2||'') }
    else { var nm=ls('nesam-appname'); if(typeof nm!=='string'||!nm.trim()||nm.trim()==='Nesam Deals') nm='TruePick'; var cmc=/^([A-Z][a-z]+)([A-Z][A-Za-z]*)$/.exec(nm.trim()); if(cmc){ l1=cmc[1]; l2=cmc[2]; one=true } else { var parts=nm.trim().split(/\s+/); l1=parts.shift(); l2=parts.join(' ') } }
    var w=document.getElementById('splw'); if(one) w.classList.add('one'); var i=0,tot=gr(l1).length+gr(l2).length,step=Math.min(.09,1.2/Math.max(1,tot));
    var fo=custom&&NSPL_FONTS[cfg.font||'']; if(fo){ w.style.fontFamily=fo[0]; w.style.fontStyle=fo[1] }
    function letters(str,cls,color){ if(!str) return; var row=document.createElement('div'); row.className='splr'+(cls?' '+cls:''); if(color) row.style.color=color;
      gr(str).forEach(function(c){ var sp=document.createElement('span'); sp.textContent=c===' '?'\u00a0':c; sp.style.animationDelay=(0.55+i*step)+'s'; i++; row.appendChild(sp) }); w.appendChild(row) }
    letters(l1,'',custom?(cfg.c1||''):''); letters(l2,'sy',custom?(cfg.c2||''):'');
    var m=document.getElementById('splm'),lg=(custom&&cfg.logo)||ls('nesam-logo');
    var img=document.createElement('img'); img.alt=''; img.src=(typeof lg==='string'&&/^data:image\//.test(lg))?lg:'logo.png';
    img.onerror=function(){ m.replaceChildren(); m.innerHTML='<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#D81E2D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></svg>' };
    m.appendChild(img);
    /* shrink long text so it always fits the screen */
    try{ var vw=window.innerWidth,avail=(custom||vw<=540)?(vw-56-(custom?0:90)):(vw-56-90); w.style.fontSize='46px'; var sw=w.scrollWidth; if(sw>avail) w.style.fontSize=Math.max(16,Math.floor(46*avail/sw))+'px' }catch(e){}
    var list=custom?emojis(cfg.emo):[]; var pool=list.length?list:DEF_EMO;
    var ht=document.getElementById('splheart'); ht.textContent=pool[0];
    var t0=Date.now(),done=false,tm,heartAt=(0.55+i*step+0.75)*1000;
    function end(){ done=true; clearTimeout(tm); if(el.parentNode) el.remove() }
    setTimeout(function(){
      if(done) return;
      w.querySelectorAll('.splr span').forEach(function(sp,k){ sp.style.animation='splwave .6s '+(k*step*.5)+'s ease both' });
      ht.className='splheart on'; m.classList.add('beat');
      var wrap=el.querySelector('.splwrap');
      for(var k=0;k<14;k++){ var p=document.createElement('span'); p.className='splp'; p.textContent=pool[k%pool.length];
        var ang=(k/14)*Math.PI*2+Math.random()*.4,dist=110+Math.random()*90;
        p.style.setProperty('--dx',(Math.cos(ang)*dist*1.15)+'px'); p.style.setProperty('--dy',(Math.sin(ang)*dist*0.9-30)+'px'); p.style.setProperty('--r',((Math.random()-.5)*60)+'deg');
        p.style.animationDelay=(Math.random()*.25)+'s'; p.style.fontSize=(16+Math.random()*14)+'px'; wrap.appendChild(p) }
    },heartAt);
    function ready(){ var wd=document.getElementById('word'),mk=document.getElementById('mark'); return !!(wd&&wd.textContent&&mk&&mk.getBoundingClientRect().width) }
    function fly(){
      if(done) return; done=true; clearTimeout(tm);
      try{
        var g=document.getElementById('splg'),mk=document.getElementById('mark'),wd=document.getElementById('word');
        if(!ready()){ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(end,450); return }
        ht.style.transition='opacity .25s'; ht.style.animation='none'; ht.style.opacity='0';
        el.querySelectorAll('.splp').forEach(function(q){q.style.display='none'});
        var a=mk.getBoundingClientRect(),b=wd.getBoundingClientRect(),mover=g,L,T,R,B;
        if(custom){ mover=m; m.classList.remove('beat'); m.style.animation='none'; w.style.transition='opacity .35s'; w.style.opacity='0'; L=a.left;T=a.top;R=a.right;B=a.bottom }
        else { L=Math.min(a.left,b.left);T=Math.min(a.top,b.top);R=Math.max(a.right,b.right);B=Math.max(a.bottom,b.bottom) }
        var gr=mover.getBoundingClientRect(),sc=(R-L)/gr.width;
        var dx=(L+R)/2-(gr.left+gr.width/2),dy=(T+B)/2-(gr.top+gr.height/2);
        mover.style.transition='transform .8s cubic-bezier(.6,0,.2,1)';
        mover.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
        el.style.transition='background-color .55s .3s'; el.style.backgroundColor='transparent';
        setTimeout(function(){ mover.style.transition='opacity .18s'; mover.style.opacity='0' },780);
        setTimeout(end,1000);
      }catch(e){ end() }
    }
    function tick(){ if(done) return; var e2=Date.now()-t0; if(e2>=heartAt+1100&&ready()) fly(); else if(e2>=heartAt+3000) fly(); else tm=setTimeout(tick,80) }
    tick();
    el.addEventListener('click',function(){ if(Date.now()-t0>500) fly() });
  };
  var skip=ls('nesam-splash')===0;
  var hs=(location.hash||'').replace('#',''); if(hs&&hs!=='home') skip=true;
  try{ if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches) skip=true }catch(e){}
  if(skip) return;
  var c=ls('nesam-splashcfg'),now=Date.now();
  var act=c&&c.on&&(!c.from||now>=c.from)&&(!c.to||now<=c.to);
  window.NSPL(act?c:null);
})();
</script>

  var ALIAS_RAW={seelai:'saree sari',sela:'saree sari',sattai:'shirt',kadigaram:'watch',kadikaram:'watch',cheruppu:'footwear sandal',seruppu:'footwear sandal',pai:'bag',kuzhandhai:'kids',kulandhai:'kids',pengal:'women ladies',penkal:'women ladies',aangal:'men',aankal:'men',pudavai:'saree sari',thuni:'cloth',vilakku:'lamp light',kadigaram2:'clock',paathiram:'vessel utensil',kudai:'umbrella',tupi:'cap',thoppi:'cap',kannadi:'glasses sunglass',manikattu:'watch',nagai:'jewellery jewelry',pen:'pen',puthagam:'book',pustagam:'book'};

    if(S.deals.some(function(d){return d.title&&!isExpired(d)&&!isHiddenCat(normCat(d.category))&&endingSoon(d)})||S.last) fl.append(h('button',{class:'chip',type:'button','aria-pressed':S.last?'true':'false',onclick:function(){S.last=!S.last;render()}},'⏳ '+t('lastDay')));

    var feed=$('feed'); feed.replaceChildren(); feed.className='feed'+(S.vm==='grid'?' vm-grid':S.vm==='list'?' vm-list':'');
    if(S.loading){ feed.append(h('div',{class:'empty'},h('b',null,t('loading')),t('loadingS'))); renderFooter([]); return; }
    var list=sortList(customerList());
    if(!list.length){
      var m;
      if(isSaved) m=[t('emptySavedT'),t('emptySavedS')];
      else if(S.q||S.zone||(isHome&&S.cat!=='all')||(isCats&&S.sub)) m=[t('emptySearchT'),t('emptySearchS')];
      else m=[t('emptyNoneT'),t('emptyNoneS')];
      feed.append(h('div',{class:'empty'},h('b',null,m[0]),m[1])); renderFooter([]); return;
    }
    var shown=[];
    if(isHome&&!S.q&&!S.last){ var rem=S.deals.filter(function(d){return S.saved.has(d.id)&&!isExpired(d)&&!isEnded(d)&&endingSoon(d)}).length; if(rem) feed.append(h('button',{class:'remb',type:'button',onclick:function(){S.tab='saved';S.last=false;render();window.scrollTo(0,0)}},t('remindSaved',{n:rem}))); }
    if(isHome&&!S.q&&S.sort==='new'&&!S.zone){
      var pins=list.filter(function(d){return d.pinned}),rest=list.filter(function(d){return !d.pinned});
      if(pins.length){ feed.append(h('div',{class:'day star'},'★ '+t('pinned'))); pins.forEach(function(d){feed.append(card(d));shown.push(d)}); }
      var last='';
      rest.forEach(function(d){
        var lab=dayLabel(d.createdAt||0);
        if(lab!==last){feed.append(h('div',{class:'day'},lab));last=lab}
        feed.append(card(d)); shown.push(d);
      });
    } else { list.forEach(function(d){feed.append(card(d));shown.push(d)}); }
    if(S.live&&S.hitLimit) feed.append(h('button',{class:'moreb',type:'button',onclick:function(){S.limit+=PAGE;subscribeDeals()}},t('moreDeals')));
    renderFooter(shown);
  }

  function readFile(f){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(f)})}
  function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=src})}
  async function encode(src,dim,q,png){
    var im=await loadImg(src),s=Math.min(1,dim/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*s)); c.height=Math.max(1,Math.round(im.height*s));
    var x=c.getContext('2d'); if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    return png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q);
  }
  async function fitPhotos(srcs){
    function total(a){return a.reduce(function(n,s){return n+s.length},0)}
    if(total(srcs)<=IMG_BUDGET) return srcs;
    var lv=[[640,.66],[560,.6],[480,.55],[420,.5],[360,.45],[300,.4],[260,.35]];
    for(var i=0;i<lv.length;i++){
      var out=[]; for(var j=0;j<srcs.length;j++) out.push(await encode(srcs[j],lv[i][0],lv[i][1]));
      if(total(out)<=IMG_BUDGET) return out;
    }
    return null;
  }

  onAuth(cb){ onAuthStateChanged(auth,async u=>{ cb(await checkAdmin(u),u); }); },
  async signIn(){
    try{ const r=await signInWithPopup(auth,provider); return {signedIn:true,admin:await checkAdmin(r.user)}; }
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){ await signInWithRedirect(auth,provider); return {signedIn:false}; }
      throw e;
    }
  },
  signOut(){ return fsignOut(auth); }
};
window.dispatchEvent(new Event('nesam-ready'));
if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
