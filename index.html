<style>
:root{
  /* Layout idea: royal-blue brand header (from the logo), yellow action buttons, red discount tags, swipeable photo cards in a day-grouped feed. */
  --hdr:#002C9D; --hdr-ink:#FFFFFF;
  --ink:#141B3A; --muted:#5B6385; --bg:#F2F5FC; --card:#FFFFFF; --line:#DFE4F2; --chip:#E6EBF8;
  --brand:#1546C6; --accent:#FFC20E; --accent-ink:#14213D; --hot:#D81E2D; --save:#0A8A5F;
  --shadow:0 1px 2px rgba(20,27,58,.06),0 8px 22px rgba(20,27,58,.08);
  --display:'Baloo Thambi 2','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic','Hind Madurai',system-ui,sans-serif;
  --body:'Hind Madurai','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Naskh Arabic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
    --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --hdr:#0A1F55; --ink:#EDF1FF; --muted:#9BA5C7; --bg:#0B1022; --card:#141B34; --line:#26304F; --chip:#1D2745;
  --brand:#8CB3FF; --hot:#FF5468; --save:#34D399; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 14px 11px}
.hdr-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;color:inherit}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.bt{display:flex;flex-direction:column;min-width:0}
.word{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;line-height:1.05;letter-spacing:-.2px}
.word b{color:var(--accent);font-weight:800}
.tag{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:5px;flex:none}
.brand{min-width:0;flex:1 1 auto}
@media (max-width:430px){.word,.word b{font-size:21px!important}.tag{white-space:normal!important;font-size:11.5px!important;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#lang{width:80px!important;max-width:80px!important;font-size:12px!important}.hdr-r{gap:4px}.hdr-r .hbtn{width:34px;height:34px}.tag{font-size:10.5px!important}.hdr-in{gap:8px}}
@media (max-width:375px){#lang{width:66px!important;max-width:66px!important}.tag{font-size:10px!important}}
.hdr-r .hbtn{width:36px;height:36px;border-radius:11px}
#lang{max-width:96px!important;height:36px!important;padding:0 4px!important;font-size:13px!important}
.hdr select{height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:0 8px;font-size:14px;font-weight:600;max-width:112px}
.hdr select option{color:#141B3A;background:#fff}
.hbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}

.wrap{max-width:1040px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.strip{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:12px}
.strip strong{font-family:var(--display);font-size:22px;color:var(--brand);line-height:1}
.strip span{color:var(--muted);font-size:14px}
.demo{background:#FFF3C4;color:#5B4500;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.slow{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px;color:var(--muted)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px 0 44px;font-size:16px}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;height:36px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;font-weight:600}
.join{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.join b{font-family:var(--display);font-size:17px}
.join a{background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:999px;padding:7px 14px;font-size:14px;margin-left:6px}

/* feed + cards */
.tov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;justify-content:flex-end;align-items:flex-start;padding:66px 12px 0}
.tbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tbox .ttl{font-weight:800;padding:8px 10px 6px;font-family:var(--display)}
.topt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:10px;border:0;background:none;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:start}
.topt[aria-pressed="true"]{background:var(--chip);outline:2px solid var(--brand)}
.xstats{display:block;width:100%;max-width:680px}
.xsrange{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.xsrange button{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;color:var(--ink)}.xsrange button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.xsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.xscard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.xscard b{font-size:26px;font-family:var(--display)}.xscard span{font-size:13px;color:var(--mute,#64748B)}
.xsbars{display:flex;align-items:flex-end;gap:4px;height:84px;margin:10px 0 4px}.xsb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;height:100%}.xsb i{width:100%;display:block;border-radius:3px 3px 0 0;min-height:1px}.xsb small{font-size:9px;color:var(--mute,#64748B)}.xsleg{display:flex;gap:14px;font-size:12px;font-weight:700}
.xstab{width:100%;border-collapse:collapse;font-size:13px}.xstab th,.xstab td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}.xstab td:first-child{text-align:start;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xsrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.xsrow span{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xsbar2{flex:1;height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.xsbar2 i{display:block;height:100%;background:var(--brand)}
.ov{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.ov.mid{align-items:center;padding:16px}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto;box-shadow:0 -6px 30px rgba(0,0,0,.3)}
.ov.mid .sheet{border-radius:20px}
.cmprow{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.cmprow.low{border-color:#16A34A;background:rgba(22,163,74,.08)}
.cmprow .nm{font-weight:700}.cmprow .pr{font-size:20px;font-weight:800;font-family:var(--display)}.cmprow small{display:block;color:var(--mute,#64748B)}
.cmprow a{margin-inline-start:auto;padding:12px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.badge-low{background:#16A34A;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
.cmpb{width:100%;min-height:40px;margin:6px 0;border-radius:12px;border:1.5px solid var(--brand);background:none;color:var(--brand);font-weight:700;cursor:pointer}
.gdot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#E11D48;animation:gpulse 1.3s infinite}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.7)}70%{box-shadow:0 0 0 9px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
@media (prefers-reduced-motion:reduce){.gdot{animation:none}}
.gopt{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.gopt:disabled{font-size:20px;color:var(--ink);opacity:1;cursor:default}
.gopt.ok{border-color:#16A34A;background:rgba(22,163,74,.15)}.gopt.bad{border-color:#F59E0B;background:rgba(245,158,11,.14)}
.gimg{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--chip);display:block}
.wdots{display:flex;gap:6px;justify-content:center;margin:12px 0}.wdots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.wdots i.on{background:var(--brand);width:22px}
.wbig{font-size:60px;text-align:center;line-height:1.1}
.wgo,.pgo{display:block;width:100%;min-height:48px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;text-align:center;line-height:48px}
.wskip{background:none;border:0;color:var(--mute,#64748B);font-weight:700;padding:10px;cursor:pointer;font-size:15px}
.bbox{max-height:80vh;overflow:auto;min-width:290px;max-width:94vw}
.nrow{padding:8px 10px;border-top:1px solid var(--line)}
.nlab{font-weight:700;font-size:14px;margin-bottom:6px}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nnone{padding:10px;color:var(--mute,#64748B);font-size:14px}
.nmark{margin:4px 10px 8px}
.tsw{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.remb{display:block;width:100%;text-align:start;margin:0 0 12px;padding:12px 14px;border-radius:12px;border:1.5px solid #F59E0B;background:#FEF3C7;color:#7C2D12;font-weight:700;font-size:14px;cursor:pointer;grid-column:1/-1}
[data-theme=dark] .remb{background:#3A2A0A;color:#FCD34D}
/* view modes: big / grid / list */
.vmb{flex:none;width:38px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.vmb[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters .vsp{flex:1;min-width:4px}
.pnote{font-size:11.5px;line-height:1.45;color:var(--muted);text-align:center;margin:-4px 0 10px;padding:0 6px}
.vmb.cn{width:28px;height:36px;font-size:14px;font-weight:700;border-radius:8px}
.filters.hascn{gap:5px}.filters.hascn select{flex:1 1 0;min-width:0;max-width:150px;padding:0 8px;font-size:13px}.filters.hascn .vsp{display:none}.filters.hascn .vmb:not(.cn){width:34px}
.feed.vm-grid.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.feed.vm-grid.g3 .body{padding:6px 6px 8px;gap:3px}
.feed.vm-grid.g3 .title{font-size:11.5px;line-height:1.25}
.feed.vm-grid.g3 .now{font-size:14.5px}
.feed.vm-grid.g3 .was,.feed.vm-grid.g3 .meta,.feed.vm-grid.g3 .desc,.feed.vm-grid.g3 .rx,.feed.vm-grid.g3 .cmtb,.feed.vm-grid.g3 .actions .ico,.feed.vm-grid.g3 .dbtn{display:none}
.feed.vm-grid.g3 .saving{font-size:11px;padding:1px 6px}
.feed.vm-grid.g3 .buy{height:30px;font-size:11.5px;border-radius:8px;padding:0 4px}
.feed.vm-grid.g3 .off{font-size:10px;padding:1px 5px;left:4px;top:4px}
.media{overflow:hidden}.media .track{position:absolute;inset:0}
.feed.vm-grid .cmpb,.feed.vm-list .cmpb{display:none}
.feed.vm-grid .rx,.feed.vm-list .rx{gap:4px;margin:2px 0}
.feed.vm-grid .rxb,.feed.vm-list .rxb{min-height:34px;border-radius:9px;padding:0}
.feed.vm-grid .rxb small,.feed.vm-list .rxb small{display:none}
.feed.vm-grid .rxe,.feed.vm-list .rxe{font-size:13px;gap:2px}.feed.vm-grid .rxe b,.feed.vm-list .rxe b{font-size:11px}
.feed.vm-grid .cmtb,.feed.vm-list .cmtb{display:block;min-height:34px;padding:0 8px;font-size:13px}
.feed.vm-grid .desc,.feed.vm-list .desc{display:-webkit-box;-webkit-line-clamp:2;font-size:12.5px;line-height:1.3}
.dbtn{display:none;align-self:flex-start;background:none;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer}
.feed.vm-grid .dbtn,.feed.vm-list .dbtn{display:inline-block}
.sharecard{grid-column:1/-1;background:linear-gradient(135deg,#0a8a5f,#1546c6);color:#fff;border-radius:18px;padding:16px;margin:6px 0;display:flex;align-items:center;gap:12px}.sharecard b{font-size:16px;display:block}.sharecard span{font-size:13px;opacity:.92}.sharecard button{flex:none;background:#fff;color:#0b2a6b;border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer}.shl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.shl button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:700;cursor:pointer}.shl button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent}.shb{display:flex;flex-direction:column;gap:8px}.shb a,.shb button{display:block;text-align:center;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}.shb .wa{background:#25d366;color:#fff}.shb .ot{background:var(--accent);color:var(--accent-ink)}.shb .cp{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.dsheet{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.6);display:flex;align-items:flex-end;justify-content:center}
.dsheet>div{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 22px}
.dsheet h3{margin:0 28px 8px 0;font-size:17px}.dsheet p{white-space:pre-line;overflow-wrap:anywhere;margin:0 0 14px;font-size:15px;line-height:1.5}
.dsheet .dx{position:absolute;right:14px;top:10px;background:none;border:0;font-size:26px;color:var(--ink);cursor:pointer}
.feed.vm-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feed.vm-grid .media{aspect-ratio:1/1}
.feed.vm-list{grid-template-columns:1fr;gap:10px}
.feed.vm-list .card{flex-direction:row;align-items:stretch}

.feed.vm-grid .body,.feed.vm-list .body{padding:8px 10px 10px;gap:4px;min-width:0}
.feed.vm-grid .title,.feed.vm-list .title{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed.vm-grid .now,.feed.vm-list .now{font-size:19px}
.feed.vm-grid .was,.feed.vm-list .was{font-size:12.5px}
.feed.vm-grid .more,.feed.vm-grid .checked,.feed.vm-grid .vidbtn,.feed.vm-grid .coupon,.feed.vm-grid .extra,.feed.vm-grid .timer,
.feed.vm-list .more,.feed.vm-list .checked,.feed.vm-list .vidbtn,.feed.vm-list .coupon,.feed.vm-list .extra,.feed.vm-list .timer,.feed.vm-list .x__{display:none}

.feed{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.day{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:18px;margin:8px 0 -2px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day.star{color:var(--hot)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.media{position:relative;aspect-ratio:4/3;background:var(--chip)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:100%}
.slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;-webkit-user-drag:none}
.off{position:absolute;left:10px;top:10px;background:var(--hot);color:#fff;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;pointer-events:none}
.flags{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:none}
.flag{background:rgba(20,27,58,.88);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.flag.loot{background:var(--hot)}
.flag.star{background:var(--accent);color:var(--accent-ink)}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:#fff;width:18px;border-radius:6px}
.count{position:absolute;right:10px;bottom:8px;background:rgba(20,27,58,.78);color:#fff;font-size:12px;padding:1px 8px;border-radius:999px;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#141B3A;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.arrow.l{left:8px}.arrow.r{right:8px}
@media (hover:hover){.media:hover .arrow{display:grid}}
.ended{position:absolute;inset:0;background:rgba(11,16,34,.66);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;pointer-events:none;text-align:center;padding:12px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.spill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 7px;border-radius:99px;background:#FFFFFF;border:1px solid rgba(15,30,60,.22);color:#14213D;font-size:11.5px;font-weight:800;line-height:18px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spill i{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.feed .meta .spill{display:inline-flex!important}
.feed.vm-grid.g3 .meta{display:flex!important}.feed.vm-grid.g3 .meta>*:not(.spill){display:none!important}
.title{margin:0;font-size:17px;font-weight:700;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.now.offer{font-size:20px;color:var(--hot)}
.was{color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.saving{color:var(--save);font-weight:800;font-size:16px;background:color-mix(in srgb,var(--save) 15%,transparent);border:1.5px solid color-mix(in srgb,var(--save) 45%,transparent);padding:3px 12px;border-radius:999px;display:inline-block}
.price .saving{flex:0 0 auto}
.feed.vm-grid .saving,.feed.vm-list .saving{font-size:13.5px;padding:2px 9px}
.extra{background:color-mix(in srgb,var(--save) 14%,transparent);color:var(--save);font-weight:700;font-size:14px;border-radius:10px;padding:5px 10px}
.coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed var(--brand);border-radius:12px;padding:6px 6px 6px 12px}
.coupon small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.coupon code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:16px;letter-spacing:.5px;user-select:all;overflow-wrap:anywhere}
.coupon button{height:36px;border-radius:9px;border:0;background:var(--brand);color:#fff;font-weight:700;padding:0 14px;cursor:pointer;flex:none}
.timer{font-size:13px;font-weight:700;color:var(--hot)}
.checked{font-size:12.5px;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:15px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc.open{display:block}
.more{align-self:flex-start;background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;font-size:14px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.buy{flex:1;display:inline-flex;align-items:center;justify-content:center;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:16px;text-align:center;padding:0 10px}
.buy[aria-disabled="true"]{background:var(--chip);color:var(--muted);pointer-events:none}
.ico{width:46px;height:46px;flex:none;border-radius:13px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ico[aria-pressed="true"]{color:var(--hot);border-color:var(--hot)}
.empty{grid-column:1/-1;text-align:center;padding:42px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:4px}
.moreb{grid-column:1/-1;justify-self:center;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 22px;font-weight:700;cursor:pointer}
.moreb.auto{border:0;background:none;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:default}
.adel{margin-left:auto;border:0;background:none;font-size:16px;line-height:1;padding:4px 6px;cursor:pointer}
.pnd{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin:10px 0}
.pnd .pnh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pnd .pnh b{color:var(--ink,inherit);font-size:15px}
.pnd .pnpop{background:#FEF3C7;color:#92400E;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
.pnd h4{margin:8px 0 4px;font-size:16px}
.pnd p{margin:4px 0;font-size:13px;color:var(--muted)}
.pnd .pnr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pnd .pnr a,.pnd .pnr button,.pnd .pnr label{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;display:inline-flex;align-items:center;cursor:pointer;text-decoration:none;color:inherit}
.pnd .pnr .ok{background:#15803D;border-color:#15803D;color:#fff}
.pnd .pnr .ok[disabled]{opacity:.4;cursor:not-allowed}
.pnd img.pnv{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pnd input[type=file]{display:none}
.back{display:inline-flex;align-items:center;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-weight:700;cursor:pointer;margin-bottom:12px}
.foot{max-width:1040px;margin:26px auto 0;color:var(--muted);font-size:13px;line-height:1.6}
.foot p{margin:0 0 6px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:56px}
.nav button[aria-current="page"]{color:var(--brand)}
.badge{background:var(--hot);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

.ptitle{font-family:var(--display);font-size:22px;margin:4px 0 4px;line-height:1.25}
.catgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.cattile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 20px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;box-shadow:var(--shadow)}
.cattile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cc,var(--brand))}
.cattile b{font-family:var(--display);font-size:18px;line-height:1.25}
.cattile span{color:var(--muted);font-size:13px}
.cattile.zero{opacity:.55}
.catbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.catbar h2{font-family:var(--display);margin:0;font-size:22px}
.catbar .back{margin:0}
.social{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;margin-bottom:10px;box-shadow:var(--shadow);max-width:560px}
.sb{width:46px;height:46px;border-radius:14px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none;font-family:var(--display)}
.sn{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.sn small{color:var(--muted)}
.sface{width:50px;height:38px;flex:none;display:inline-flex;margin-inline-end:8px}
.sface svg{width:100%;height:100%;overflow:visible}
.sface .sw,.sface .sh,.sface .ss{display:none}
.sface[data-s=w] .sw,.sface[data-s=h] .sh,.sface[data-s=s] .ss{display:inline}
.sface[data-s=w] .hd{animation:sfb 1s ease-in-out infinite}
.sface[data-s=h] .fc{animation:sfh .5s ease-in-out 2}
.sface[data-s=s] .face{fill:#CFC6A8}
.sface[data-s=s] svg{opacity:.8}
.sface[data-s=s] .hd{transform:translateY(5px) rotate(18deg);transform-origin:30px 18px}
@keyframes sfb{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes sfh{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.sface *{animation:none!important}}
.pvbox{border:1.5px dashed var(--accent,#FFC61A);border-radius:14px;padding:10px;margin:0 0 14px;background:var(--bg,#F7F8FC)}
.pvl{display:block;font-size:12px;font-weight:700;opacity:.75;margin:0 0 8px}
.pvhdr{display:flex;align-items:center;gap:10px;background:var(--hdr,#0F3BB5);color:#fff;padding:10px 14px;border-radius:12px;margin:0 0 8px}
.pvhdr img,.pvlg{width:38px;height:38px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.pvhdr b{display:block;font-size:16px}.pvhdr span{font-size:12px;opacity:.85}
.pvrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pvnote{font-size:12px;opacity:.75;margin:6px 0;line-height:1.5}
.go2{color:var(--brand);font-weight:700;font-size:14px;flex:none}
.srow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.srow input,.srow select{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;min-height:44px;min-width:0}
.srow button{align-self:flex-end;min-height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;padding:0 12px;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(5,8,20,.94);z-index:50;display:flex;flex-direction:column}
.lb .track{flex:1}
.lb .slide{display:grid;place-items:center;height:100%}
.lb .slide img{width:100%;height:100%;object-fit:contain;cursor:default}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;color:#fff}
.lb-top button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer}
.toast .tundo{margin-left:12px;background:#fff;color:#111;border:0;border-radius:9px;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer}.toast{display:flex;align-items:center;justify-content:center;position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}

/* seller studio (admin only) */
.sbar{background:var(--hdr);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sbar b{font-family:var(--display);font-size:19px}
.sbar button{height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 14px;cursor:pointer}
.stabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.stabs button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;white-space:nowrap;padding:0 12px}
.stabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:680px}
.panel h2{font-family:var(--display);margin:0 0 12px;font-size:21px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label,.lbl{font-size:14px;font-weight:700}
.fld input,.fld select,.fld textarea{min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;min-height:44px}
.fld textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--hot);font-size:14px;font-weight:700;margin:0 0 10px}
.ok{color:var(--save);font-size:14px;font-weight:700;margin:0 0 10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.ph .first{position:absolute;left:4px;bottom:4px;border:0;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;font-size:12px;padding:2px 7px;cursor:pointer}
.ph .cov{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--accent-ink);border-radius:8px;font-size:12px;font-weight:700;padding:2px 7px}
.addph{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;text-align:center;cursor:pointer;font-weight:700;color:var(--brand);font-size:14px}
.addph input{display:none}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px}
.chk input{width:22px;height:22px}
.btns.stk{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:5;background:var(--card);padding:8px 0;margin-top:10px;box-shadow:0 -8px 10px -6px var(--card)}
.catline{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-4px 0 12px}.catline small{opacity:.7;font-size:12px}
/* top 10 */
.t10r{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.t10c{flex:0 0 40%;position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:var(--ink);text-decoration:none}
.t10c img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block}
.t10k{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:#1546C6;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.t10k.g{background:#D4A017}.t10k.s{background:#8A94A6}.t10k.b{background:#B5651D}
.t10t{font-size:12.5px;font-weight:700;padding:6px 8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t10p{color:var(--save);font-weight:800;padding:2px 8px 8px;font-size:14px}
/* you may also like */
.alike{margin:14px 0 6px}.alike h3{margin:0 0 8px;font-size:16px}.alg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alc{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink);text-decoration:none}
.alc img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block}.alc div{font-size:11.5px;font-weight:700;padding:5px 6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.alc b{display:block;color:var(--save);font-size:13px;padding:2px 6px 7px}
/* savings report */
#svr{margin:4px 0 14px}
.svc{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(140deg,#0B6B3A 0%,#128C4F 55%,#C99A2E 130%);box-shadow:0 10px 24px rgba(11,107,58,.28);position:relative;overflow:hidden}
.svc:after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.svc .m{font-size:12.5px;opacity:.92;font-weight:700}.svc .big{font-size:40px;font-weight:900;margin:4px 0 2px;font-variant-numeric:tabular-nums}.svc .sub{font-size:13.5px}
.svyr{border-radius:20px;padding:16px;color:#fff;background:radial-gradient(circle at 20% 10%,#3B2A8F,#140F3A 70%);position:relative;overflow:hidden;margin-bottom:10px}
.svyr .big{font-size:34px;font-weight:900;color:#FFD54A}.svyr .m{font-weight:800;font-size:13px}.svyr .fw{position:absolute;font-size:18px;animation:svtw 1.6s ease-in-out infinite}
@keyframes svtw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.svbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;color:var(--ink)}
.svbr{margin:7px 0}.svbr div{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.svbr i{display:block;height:8px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden}.svbr i u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#128C4F,#C99A2E)}
.svbest{display:flex;gap:10px;align-items:center;background:#FFF9E8;border:1px solid #F3DFA2;border-radius:14px;padding:10px;margin-top:10px;color:#1B2440}.svbest small{display:block;font-size:11.5px;color:#8A6200;font-weight:800}.svbest em{font-style:normal;color:#0B7A43;font-weight:800;font-size:13px}
.svmon{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.svmon button{flex:none;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}.svmon button[aria-pressed=true]{background:#0B6B3A;color:#fff;border-color:#0B6B3A}
.svtrust{margin-top:10px;background:color-mix(in srgb,var(--brand) 7%,var(--card));border-radius:14px;padding:12px;font-size:13px;line-height:1.6;color:var(--ink)}
.svsh{display:block;width:100%;margin-top:10px;background:var(--card);border:2px solid #0B6B3A;color:#0B6B3A;border-radius:12px;text-align:center;font:inherit;font-weight:900;padding:11px;cursor:pointer}
.svgo{display:block;width:100%;margin-top:8px;background:#FFC61A;border:0;color:#1B2440;border-radius:12px;text-align:center;font:inherit;font-weight:900;padding:12px;cursor:pointer}
.svline{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#E9F8EF,#FFF6DC);border:1px solid #CFE9D9;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;color:#0B5A33;margin:0 0 10px;cursor:pointer;width:100%;font-family:inherit;text-align:start}
.svline span{flex:1}
.svov{position:fixed;inset:0;background:rgba(10,15,35,.6);display:flex;align-items:center;justify-content:center;padding:60px 18px;z-index:95;opacity:0;transition:opacity .4s}
.svov.on{opacity:1}
.svmb{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:scale(.8);transition:transform .5s cubic-bezier(.2,.9,.3,1.3);color:#1B2440}
.svov.on .svmb{transform:scale(1)}.svmb h4{margin:2px 0 10px;text-align:center;font-size:16px}
.svmb img{width:100%;aspect-ratio:1/1;border-radius:16px;display:block;background:#eef}
.svask{display:flex;gap:8px;margin-top:12px;opacity:0;transform:translateY(8px);transition:all .5s;pointer-events:none}.svask.on{opacity:1;transform:none;pointer-events:auto}
.svask button{flex:1;padding:13px 6px;border-radius:14px;font:inherit;font-weight:900;font-size:14.5px;cursor:pointer;border:0}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection as fcol,doc as fdoc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,getDocs,onSnapshot,query,where as fwhere,orderBy as forder,limit as flimit,increment as finc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut as fsignOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyBRGSq_RwBD2YEGtL9_Nds3L50J6OFsBTM",
  authDomain:"nesamdeal.firebaseapp.com",
  projectId:"nesamdeal",
  storageBucket:"nesamdeal.firebasestorage.app",
  messagingSenderId:"633779911443",
  appId:"1:633779911443:web:75e803e921f3499e5e38e6"
};
const app=initializeApp(firebaseConfig);
let fs;
try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=getFirestore(app)}
const auth=getAuth(app);
const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),size:s.size});

class Q{
  constructor(name,cs){this.name=name;this.cs=cs||[]}
  where(f,o,v){return new Q(this.name,this.cs.concat([fwhere(f,o,v)]))}
  orderBy(f,d){return new Q(this.name,this.cs.concat([forder(f,d||'asc')]))}
  limit(n){return new Q(this.name,this.cs.concat([flimit(n)]))}
  _q(){return query(fcol(fs,this.name),...this.cs)}
  get(){return getDocs(this._q()).then(wrap)}
  onSnapshot(ok,err){return onSnapshot(this._q(),s=>ok(wrap(s)),err)}
}
const db={
  collection(name){
    const q=new Q(name);
    return {
      add:d=>addDoc(fcol(fs,name),d),
      doc:id=>({set:d=>setDoc(fdoc(fs,name,id),d),update:p=>updateDoc(fdoc(fs,name,id),p),delete:()=>deleteDoc(fdoc(fs,name,id))}),
      where:(f,o,v)=>q.where(f,o,v),orderBy:(f,d)=>q.orderBy(f,d),limit:n=>q.limit(n),get:()=>q.get(),onSnapshot:(a,b)=>q.onSnapshot(a,b)
    };
  },
  doc(path){
    const [c,i]=path.split('/'),ref=fdoc(fs,c,i);
    return {set:d=>setDoc(ref,d),onSnapshot:(ok,err)=>onSnapshot(ref,s=>ok({exists:s.exists(),data:()=>s.data()}),err)};
  }
};
/* Admin test: the Firestore rules only let the owner's Google account read admin/ping. Nobody else can. */
async function checkAdmin(u){
  if(!u) return false;
  const key='nesam-adm-'+u.uid;
  try{ await getDoc(fdoc(fs,'admin','ping')); try{localStorage.setItem(key,'1')}catch(e){} return true; }
  catch(e){
    if(e&&e.code==='permission-denied'){ try{localStorage.removeItem(key)}catch(x){} return false; }
    try{return localStorage.getItem(key)==='1'}catch(x){return false}
  }
}
const provider=new GoogleAuthProvider();
function incConv(o){const r={};for(const k in o){r[k]=(typeof o[k]==='number')?finc(o[k]):incConv(o[k])}return r}
window.NESAM={
  db,
  inc(col,id,obj){ return setDoc(fdoc(fs,col,id),incConv(obj),{merge:true}) },
  track(day,obj){ try{ return setDoc(fdoc(fs,'stats',day),incConv(obj),{merge:true}).catch(()=>{}) }catch(e){} },
  onAuth(cb){ onAuthStateChanged(auth,async u=>{ cb(await checkAdmin(u),u); }); },
  async signIn(){
    try{ const r=await signInWithPopup(auth,provider); return {signedIn:true,admin:await checkAdmin(r.user)}; }
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){ await signInWithRedirect(auth,provider); return {signedIn:false}; }
      throw e;
    }
  },
  signOut(){ return fsignOut(auth); },
  async token(){ try{ return auth.currentUser?await auth.currentUser.getIdToken():'' }catch(e){ return '' } }
};
window.dispatchEvent(new Event('nesam-ready'));
if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
